<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Naarad</title>
    <script>
      (function () {
        var path = window.location.pathname.replace(/^\/+|\/+$/g, "");
        var page =
          path === "routes" ||
          path === "planner" ||
          path === "features" ||
          path === "updates" ||
          path === "about" ||
          path === "app" ||
          path === "privacy" ||
          path === "terms" ||
          path === "accessibility"
            ? path
            : path.indexOf("routes/") === 0
              ? "route-" + path.slice(7).replace("iit-madras", "iitmadras")
              : "home";
        window.location.replace("/?page=" + encodeURIComponent(page));
      })();
    </script>
  </head>
  <body>
    Loading Naarad...
  </body>
</html>
